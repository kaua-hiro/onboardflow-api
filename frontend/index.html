<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%2314172E'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='58' font-weight='700' fill='%23C08A2E' text-anchor='middle'%3EO%3C/text%3E%3C/svg%3E">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnboardFlow - Gestão de Acessos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <style>
    /* Kept alongside style.css: sizing/behavior rules that aren't
       part of the visual identity, just layout mechanics. */
    .task-item {
        transition: background-color 0.2s;
        border-radius: 6px;
        margin-bottom: 4px;
    }
    .task-item:hover { background-color: #f9fafb; }

    .task-done-text {
        text-decoration: line-through;
        font-style: italic;
    }

    .btn-check-toggle {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s;
    }
    .btn-check-toggle:active { transform: scale(0.9); }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <div>
            <span class="navbar-brand mb-0 h1"><i class="bi bi-person-badge-fill me-2"></i>OnboardFlow</span>
            <div class="navbar-tagline">IT Onboarding · Enterprise Corp</div>
        </div>
        <button class="btn btn-outline-light btn-sm" onclick="loadEmployees()">
            <i class="bi bi-arrow-clockwise"></i> Atualizar
        </button>
    </div>
</nav>

<div class="container">
    <div id="statsBar" class="stats-bar mb-4"></div>

    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <h5 class="card-title mb-3">🚀 Novo Colaborador</h5>
            <form id="employeeForm" class="row g-3" novalidate>
                    <input type="hidden" id="employeeId">
                <div class="col-md-4">
                    <label class="field-label" for="fullName">Nome completo</label>
                    <input type="text" class="form-control" id="fullName" placeholder="Ex: Kauã Hiro" required>
                    <div class="field-error">Informe o nome completo.</div>
                </div>
                <div class="col-md-4">
                    <label class="field-label" for="role">Cargo</label>
                    <input type="text" class="form-control" id="role" placeholder="Ex: Dev Python" required>
                    <div class="field-error">Informe o cargo.</div>
                </div>
                <div class="col-md-3">
                    <label class="field-label" for="startDate">Data de início</label>
                    <input type="date" class="form-control" id="startDate" required>
                    <div class="field-error">Escolha a data de início.</div>
                </div>
                <div class="col-md-1 d-flex align-items-end">
                    <button type="submit" id="submitBtn" class="btn btn-primary w-100"><i class="bi bi-plus-lg"></i></button>
                </div>
            </form>
        </div>
    </div>

    <div class="roster-toolbar mb-3">
        <div class="roster-search">
            <i class="bi bi-search"></i>
            <input type="text" id="searchInput" placeholder="Buscar por nome ou cargo...">
        </div>
        <select id="statusFilter" class="form-select roster-filter">
            <option value="all">Todos os status</option>
            <option value="todo">A Iniciar</option>
            <option value="progress">Em Andamento</option>
            <option value="done">Concluído</option>
        </select>
        <button class="btn btn-light border" id="exportCsvBtn" type="button">
            <i class="bi bi-download me-1"></i> Exportar CSV
        </button>
    </div>

    <div id="employeesList" class="row align-items-start">
        </div>
</div>

<div id="liveRegion" class="visually-hidden" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="script.js"></script>
</body>
</html>
