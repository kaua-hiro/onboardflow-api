<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="icon" href="data:,">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnboardFlow - Gestão de Acessos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <style>
    /* Kept alongside style.css: sizing/behavior rules that aren't
       part of the visual identity, just layout mechanics. */
    .avatar-circle {
        width: 48px;
        height: 48px;
        object-fit: cover;
    }

    .task-item {
        transition: background-color 0.2s;
        border-radius: 6px;
        margin-bottom: 4px;
    }
    .task-item:hover { background-color: #f9fafb; }

    .task-done-text {
        text-decoration: line-through;
        font-style: italic;
    }

    .btn-check-toggle {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s;
    }
    .btn-check-toggle:active { transform: scale(0.9); }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1"><i class="bi bi-person-badge-fill me-2"></i>OnboardFlow</span>
        <button class="btn btn-outline-light btn-sm" onclick="loadEmployees()">
            <i class="bi bi-arrow-clockwise"></i> Atualizar
        </button>
    </div>
</nav>

<div class="container">
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <h5 class="card-title mb-3">🚀 Novo Colaborador</h5>
            <form id="employeeForm" class="row g-3">
                    <input type="hidden" id="employeeId">
                <div class="col-md-4">
                    <input type="text" class="form-control" id="fullName" placeholder="Nome Completo" required>
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control" id="role" placeholder="Cargo (Ex: Dev Python)" required>
                </div>
                <div class="col-md-3">
                    <input type="date" class="form-control" id="startDate" required>
                </div>
                <div class="col-md-1">
                    <button type="submit" id="submitBtn" class="btn btn-primary w-100"><i class="bi bi-plus-lg"></i></button>
                </div>
            </form>
        </div>
    </div>

    <div id="employeesList" class="row align-items-start">
        </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="script.js"></script>
</body>
</html>
